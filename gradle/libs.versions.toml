[versions]
spring-boot = "4.1.1"
mybatis-spring-boot = "4.1.0"

[libraries]
# BOM: 라이브러리를 끌어오지 않고 버전 제약만 추가한다
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Spring Boot starter: 버전은 BOM이 정한다
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Spring Boot BOM에 없는 서드파티 starter라 버전을 직접 관리한다
mybatis-spring-boot-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatis-spring-boot" }

# 테스트: 버전은 Spring Boot BOM이 정한다 (JUnit 6.0.3, AssertJ 3.27.7)
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }

# DB: 버전은 Spring Boot BOM이 정한다 (Flyway 12.4, Oracle JDBC 23.26.3, Testcontainers 2.0.5)
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-oracle = { module = "org.flywaydb:flyway-database-oracle" }
ojdbc17 = { module = "com.oracle.database.jdbc:ojdbc17" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-oracle-free = { module = "org.testcontainers:testcontainers-oracle-free" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
