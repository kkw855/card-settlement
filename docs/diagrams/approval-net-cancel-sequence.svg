<text x="76" y="2406.5" font-size="24" font-weight="700" fill="#172b4d" text-anchor="start">망취소가 실패하면 · 실제로 걸린 시간</text>
<text x="76" y="2450.5" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• Failed(연결 실패 · 응답 없음 · 불일치 · 0000 아님 · 처리구분 오류)면 NetCanceller가 1초 → 2초 → 4초 뒤 같은 0420을 다시 보낸다 (최대 4번)</text>
<text x="76" y="2488.5" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• 4번 모두 Failed면 오류 로그를 남기고 UNKNOWN(P003)으로 둔다. 가맹점은 실패로 처리하고 조회 API로 최종 결과를 확인한다</text>
<text x="76" y="2526.5" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• 로컬 실측(2026-11-24): 009는 3.0초 · 119(망취소에 무응답)는 22.1초 = 3 + 4 × 3 + (1 + 2 + 4). 최악 27초는 연결 1초 × 5번을 더한 값</text>
<text x="76" y="2564.5" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• 109는 PG에서 009와 똑같이 NET_CANCELLED다. 카드사가 실제로는 취소하지 않은 것은 다음 날 대사(STATUS_MISMATCH)에서 드러난다</text>
</g></svg>
