<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="2643" viewBox="0 0 1850 2643" role="img" aria-labelledby="title desc">
<title id="title">approval-net-cancel-sequence</title>
<desc id="desc">현재 구현 기준 승인 응답을 확인하지 못한 한 건(끝자리 009)이 망취소로 정리되는 호출 순서. 자세한 설명은 ../05-approval-flow.md 참조.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<rect x="0" y="0" width="1850" height="2643" rx="0" fill="#ffffff"/>
<text x="60" y="76.0" font-size="38" font-weight="700" fill="#172b4d" text-anchor="start">결과를 모르는 승인: 망취소로 어떻게 정리할까?</text>
<text x="60" y="125.0" font-size="21" font-weight="400" fill="#52647c" text-anchor="start">위에서 아래로 읽으세요 · 끝자리 009: 응답이 늦어 PG가 타임아웃 → UNKNOWN 커밋 → 0420 망취소 → NET_CANCELLED</text>
<rect x="60" y="154" width="1730" height="57" rx="8" fill="#fff6e8"/>
<text x="82" y="191.0" font-size="21" font-weight="400" fill="#a95d12" text-anchor="start">가정: 카드사는 승인한 뒤 0110을 5초 늦게 보낸다 · PG의 응답 대기는 3초 · 첫 망취소가 성공한다. 트랜잭션 없이 SQL마다 바로 커밋한다.</text>
