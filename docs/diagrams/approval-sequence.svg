<text x="82" y="191.0" font-size="21" font-weight="400" fill="#a95d12" text-anchor="start">가정: 올바른 API 키와 본문 · 새 멱등 키 · 활성 가맹점 · 정상 승인 응답. Controller도 Service도 트랜잭션을 열지 않습니다.</text>
