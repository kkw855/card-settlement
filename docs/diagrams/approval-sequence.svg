<text x="260.0" y="2225.0" font-size="18" font-weight="400" fill="#2563b0" text-anchor="middle">22  201 Created + Location</text>
<text x="260.0" y="2251.1" font-size="18" font-weight="400" fill="#2563b0" text-anchor="middle">PaymentResponse(JSON) → 가맹점</text>
<rect x="50" y="2308" width="1750" height="224" rx="12" fill="#f5f8fc" stroke="#cfdae6"/>
<text x="76" y="2349.0" font-size="24" font-weight="700" fill="#172b4d" text-anchor="start">성공 경로 밖에서 달라지는 점</text>
<text x="76" y="2393.0" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• 검사 순서: 401(API 키) → 400(본문·Idempotency-Key) → 403(정지 가맹점) → 422(할부). 여기서 막히면 저장도 전송도 없음</text>
<text x="76" y="2431.0" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• 같은 멱등 키: 처리 중이면 409, 본문이 다르면 422, 끝났으면 저장된 결과로 201 재현 → 카드사 재전송 없음</text>
<text x="76" y="2469.0" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• 연결 실패: DECLINED(P001)   /   타임아웃·확인 불가: UNKNOWN(P003). 둘 다 201이고 성공 여부는 status로 판단 · 망취소는 아직 없음</text>
<text x="76" y="2507.0" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">• SEND는 전송 전에 남김. RECV는 응답 필드 일부를 읽은 뒤, 전문구분·거래번호 검증 전에 남김.</text>
</g></svg>
