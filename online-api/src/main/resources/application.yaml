# 로컬 실행 값은 루트의 .env에서 읽는다 (compose와 같은 파일). 운영에서는 같은 이름의 환경변수로 준다.
spring:
  application:
    name: online-api
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true # 카드사 응답을 기다리는 동안 스레드를 붙잡지 않는다 (docs/03-api.md 4장)
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${APP_USER:}
    password: ${APP_USER_PASSWORD:}
  flyway:
    locations: classpath:db/migration # core에 있다 (ADR-0006)

card-company:
  host: ${CARD_COMPANY_HOST:localhost}
  port: ${CARD_COMPANY_PORT:8583}
  connect-timeout: 1s
  read-timeout: 3s

crypto:
  card-encryption-key: ${CARD_ENCRYPTION_KEY:}
  card-hmac-key: ${CARD_HMAC_KEY:}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml # core jar 안에 있으므로 classpath*로 모든 jar를 찾는다
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true # record 생성자 인자를 순서가 아니라 이름으로 컬럼에 맞춘다
    jdbc-type-for-null: 'NULL' # Oracle은 타입 없는 null 파라미터를 받지 않는다 (ORA-17004)
